# Conservative example. Paper/dry-run is enforced unless env vars explicitly allow live trading.
symbols: ["SPY", "QQQ"]
strategy_name: "ensemble"
strategy:
  short_window: 20
  long_window: 50
  min_signal_strength: 0.001
risk:
  max_position_notional_pct: 0.05
  max_total_exposure_pct: 0.15
  max_daily_loss_pct: 0.0025
  max_drawdown_pct: 0.005
  stop_on_any_loss: true
  per_position_stop_loss_pct: 0.003
  liquidate_on_halt: true
  max_risk_per_trade_pct: 0.005
  minimum_equity: 0.0
execution:
  poll_seconds: 60
  extended_hours: false
  min_cash_reserve_pct: 0.50
  trading_windows: ["09:45-11:30", "14:00-16:00"]
  max_spread_pct: 0.002
  max_slippage_pct: 0.003
  avoid_open_minutes: 15
  avoid_close_minutes: 0
