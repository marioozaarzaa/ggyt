[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ggyt-trading-bot"
version = "0.1.0"
description = "Local autonomous trading bot scaffold with Alpaca paper/live execution and strict risk controls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.40.0",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "SQLAlchemy>=2.0",
  "streamlit>=1.35",
  "keyring>=25.0",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
ggyt = "ggyt_bot.cli:app"
ggyt-bot = "ggyt_bot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
